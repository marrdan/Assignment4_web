<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="h2 mb-4">Reserve a table</h1>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="fullName" class="form-label">Your name</label>
            <input type="text" class="form-control" id="fullName" name="name"
                   autocomplete="name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   autocomplete="tel" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label for="guests" class="form-label">Guests</label>
              <input type="number" class="form-control" id="guests" name="guests"
                     min="1" max="20" step="1" required>
            </div>
            <div class="col-12 col-sm-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" name="date" required>
            </div>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label fs-6">Seating</legend>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="seating"
                     id="seatInside" value="inside" required>
              <label class="form-check-label" for="seatInside">Inside</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="seating"
                     id="seatTerrace" value="terrace">
              <label class="form-check-label" for="seatTerrace">Terrace</label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="meal" class="form-label">Meal</label>
            <select class="form-select" id="meal" name="meal">
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="comments" class="form-label">Comments (optional)</label>
            <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
            <label class="form-check-label" for="terms">I agree to the terms</label>
          </div>

          <button type="submit" class="btn btn-primary">Reserve</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
